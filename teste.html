<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .menu-off{
            background-color: black;
            height: 100vh;
            width: 100%;
            max-width: 450px;
            position: fixed;
            top: 0;
            right: -450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: .3s ease;
        }
        .menu-off .active{
            right: 0;
        }
        .hamburguer-menu{
            height: 50px;
            width: 50px;
            margin-left: auto;
            position: relative;
        }
        .hamburguer-menu article{
            height: 5px;
            width: 100%;
            background-color: #6F86FF;
            border-radius: 25px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: .3s ease;
        }
        .hamburguer-menu article:nth-child(1){
            top: 25%;
        }
        .hamburguer-menu article:nth-child(3){
            top: 75%;
        }
        .hamburguer-menu .active article:nth-child(1){
            top: 50%;
            transform: translate(-50%,-50%) rotate(45deg);
        }
        .hamburguer-menu .active article:nth-child(2){
            opacity: 0;
        }
        .hamburguer-menu .active article:nth-child(3){
            top: 50%;
            transform: translate(-50%,-50%) rotate(-45deg);
        }
    </style>
    
</head>
<body>
    <section class="menu-off">
        <ul>
            <li>home</li>
            <li>about</li>
            <li>contact</li>
        </ul>
    </section>
    <nav>
        <section class="hamburguer-menu">
            <article></article>
            <article></article>
            <article></article>
        </section>
    </nav>
    
    <script defer>
        const menuOff = document.querySelector(".menu-off")
        const hamburguerMenu = document.querySelector(".hamburguer-menu")

        hamburguerMenu.addEventListener("click",() =>{
            hamburguerMenu.classList.toggle('active');
            menuOff.classList.toggle('active');
        })

    </script>
</body>
</html>
